[workspace]
members = ["."]

[package]
name = "wormhole"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A live connection between coding-agent sessions on different machines that share one repository"
repository = "https://github.com/kaushalbalagurusamy/wormhole"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal", "fs"] }
tokio-tungstenite = "0.29"

[profile.release]
strip = true
